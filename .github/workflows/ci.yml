name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build core (Python has its own workflow)
        run: cargo build --workspace --exclude rs_python --locked
      - name: Test default features (available fixtures only)
        run: cargo test --workspace --exclude rs_python --locked
      - name: Test required-corpus runner (synthetic files only)
        shell: pwsh
        run: ./scripts/test-corpus-runner.ps1
      - name: Test optional WAD parallel and RMAN verification features
        run: cargo test -p rs_wad -p rs_rman --all-features --locked
      - name: Check minimal facade
        run: cargo check -p ritoshark --no-default-features --locked
      - name: Check BIN and WAD facade
        run: cargo check -p ritoshark --no-default-features --features bin,wad --locked
      - name: Clippy
        run: cargo clippy --workspace --exclude rs_python --all-targets --all-features --locked -- -D warnings
      - name: Format
        run: cargo fmt --all --check
