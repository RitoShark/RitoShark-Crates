name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc
      - name: Build
        run: cargo build -p rs_cli --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          $name = "rs_cli-${{ github.ref_name }}-x86_64-windows"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/rs_cli.exe" $name/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $name/
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rs_cli-x86_64-windows
          path: rs_cli-${{ github.ref_name }}-x86_64-windows.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List collected artifacts
        run: ls -R dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
