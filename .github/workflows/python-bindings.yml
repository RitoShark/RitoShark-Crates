name: python-bindings

on:
  push:
    branches: ["**"]
    tags: ["py-v*"]
  pull_request:
    paths:
      - "crates/**"
      - ".github/workflows/python-bindings.yml"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-py-
      - name: Install maturin and pytest
        run: pip install maturin pytest
      - name: Build wheel
        run: maturin build --release --out dist
        working-directory: crates/rs_python
      - name: Install built wheel
        shell: bash
        run: pip install --force-reinstall dist/*.whl
        working-directory: crates/rs_python
      - name: Run tests
        run: python -m pytest tests -v
        working-directory: crates/rs_python

  wheels:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-py-
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        run: maturin build --release --out dist
        working-directory: crates/rs_python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: crates/rs_python/dist/*.whl

  publish:
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
